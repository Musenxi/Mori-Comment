# 单独部署评论服务。和站点、Caddy 一起部署见主题仓库的 deploy/。
services:
  comments:
    image: ghcr.io/musenxi/mori-comment:latest
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/comments.db
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - comments_data:/data

volumes:
  comments_data:

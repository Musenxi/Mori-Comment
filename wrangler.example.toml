# Cloudflare Workers + D1 部署评论服务
#   1) wrangler d1 create mori-comments      （把输出的 database_id 填到下面）
#   2) wrangler d1 execute mori-comments --file=schema.sql --remote   （升级后再执行一次，补上新表；可以重复执行）
#   3) wrangler secret put ADMIN_TOKEN       （管理令牌，Studio 里用它审核评论）
#      wrangler secret put TURNSTILE_SECRET  （可选：人机验证的密钥）
#   4) wrangler deploy
name = "mori-comments"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "mori-comments"
database_id = "填 wrangler d1 create 输出的 id"

# 在线访客：WebSocket 连接交给一个 Durable Object 管（免费套餐可用，要用 SQLite 版的类）
[[durable_objects.bindings]]
name = "ONLINE"
class_name = "OnlinePresence"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnlinePresence"]

# 邮件提醒用 Cloudflare Email Service 的话（要先在 Email Service 里接入发信域名）：绑上它，Studio 里发信方式选 Cloudflare，账号 ID 和令牌留空
# [[send_email]]
# name = "EMAIL"

[vars]
ALLOW_ORIGIN = "https://你的站点"   # 允许调用评论接口的站点，多个用逗号分隔
# AUTO_APPROVE = "returning"        # returning 第一次留言先审 / all 全部直接发 / none 全部先审
